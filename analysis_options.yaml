# Strict analysis. very_good_analysis enables a large, opinionated rule set on
# top of package:lints; CI runs `flutter analyze --fatal-infos`, so every
# finding below is an error in practice.
include: package:very_good_analysis/analysis_options.yaml

linter:
  rules:
    # Disabled deliberately.
    #
    # lib/src/** uses relative imports between siblings. Beyond matching the
    # Dart SDK's own convention, it makes the one import that must never
    # appear in src/ - the public barrel - look obviously wrong
    # (`../../haptic_morse.dart`) rather than looking like every other import.
    # Version 1.x shipped exactly that bug: src/haptic/haptic_morse.dart
    # imported the barrel, which dragged package:vibration and dart:ui into
    # the pure-Dart core and made the published example unrunnable.
    always_use_package_imports: false
