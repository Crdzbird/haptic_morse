name: haptic_morse
description: Convert text to Morse code and haptic vibration patterns in Dart.
version: 2.0.0
repository: https://github.com/Crdzbird/haptic_morse
topics:
  - morse
  - haptic
  - vibration
# Only android and ios are declared: the vibration dependency ships plugin
# implementations for those two platforms only, so HapticVibration cannot
# work on macos/linux/windows.
platforms:
  android:
  ios:

homepage: https://github.com/Crdzbird/haptic_morse

environment:
  sdk: ^3.0.0

dependencies:
  characters: ^1.4.0
  meta: ^1.16.0
  vibration: ^3.2.0

dev_dependencies:
  flutter:
    sdk: flutter
  flutter_test:
    sdk: flutter
  lints: ^6.0.0
  test: ^1.25.0
  very_good_analysis: ^10.3.0
