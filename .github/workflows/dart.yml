# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Dart

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # The package depends on flutter_test and on package:vibration, so the
      # Flutter SDK is required. The previous dart-lang/setup-dart + `dart test`
      # combination could not load any test file in test/.
      # VERIFY: pin this to a commit SHA the way the old setup-dart step was,
      # once you have picked the release you want.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      # example_flutter is a separate package. Both `dart format .` and
      # `flutter analyze` descend into it from the repository root, and both
      # behave differently when its analysis_options include cannot resolve —
      # the formatter reported a file as unformatted here while the identical
      # command passed locally, purely because the deps were missing.
      - name: Install example app dependencies
        working-directory: example_flutter
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze project source
        run: flutter analyze --fatal-infos

      # Runs the untagged tests on the plain Dart SDK. This is the guard that
      # keeps package:haptic_morse/haptic_morse.dart free of Flutter and
      # dart:ui — if anything in the core starts importing them, this step
      # fails to load while `flutter test` below would still pass.
      - name: Verify the core library stays pure Dart
        run: dart test --exclude-tags flutter

      - name: Run tests
        run: flutter test --coverage

      # The bar for this package is 100%, so anything less fails the build
      # rather than quietly drifting. Note that an assert message written with
      # string interpolation is executable code that only runs on failure, and
      # therefore can never be covered — keep such messages constant.
      - name: Enforce 100% line coverage
        run: |
          awk -F: '
            /^LF:/ { total += $2 }
            /^LH:/ { hit += $2 }
            END {
              if (total == 0) { print "No coverage data found."; exit 1 }
              pct = hit / total * 100
              printf "Coverage: %d/%d (%.2f%%)\n", hit, total, pct
              if (hit != total) {
                print "::error::Line coverage must be 100%."
                exit 1
              }
            }
          ' coverage/lcov.info

      - name: Report uncovered lines
        if: failure()
        run: |
          awk -F: '
            /^SF:/ { file = $2 }
            /^DA:/ { split($2, d, ","); if (d[2] == 0) print file ":" d[1] }
          ' coverage/lcov.info

      # The example is self-verifying: it reconstructs the message from the raw
      # vibration pattern using only the platform's off/on convention and
      # throws if anything fails to match. Running it here keeps the claims in
      # the README honest, and doubles as proof the core is usable from plain
      # Dart with no Flutter and no device.
      - name: Run the self-verifying example
        run: dart run example/haptic_morse_example.dart

      - name: Run example app tests
        working-directory: example_flutter
        run: flutter test
